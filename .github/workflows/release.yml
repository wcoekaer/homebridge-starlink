name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag and notes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { name, version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (name !== 'homebridge-starlink' || !/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            throw new Error('Release tag must match the stable package version');
          }
          if (!fs.readFileSync(`releases/${tag}.md`, 'utf8').trim()) {
            throw new Error('Release notes must not be empty');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run test:child-bridge
      - name: Build installation archive and checksum
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          cd artifacts
          sha256sum homebridge-starlink-*.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/homebridge-starlink-*.tgz artifacts/SHA256SUMS \
            --verify-tag \
            --title "Homebridge Starlink $GITHUB_REF_NAME" \
            --notes-file "releases/$GITHUB_REF_NAME.md" \
            --latest
